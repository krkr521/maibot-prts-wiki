[project]
name = "maibot-prts-wiki"
version = "1.0.3"
description = "PRTS Wiki lookup and recruitment tools for MaiBot"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["maibot-plugin-sdk>=2.19.0,<3", "httpx>=0.28.0", "beautifulsoup4>=4.12.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
